<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zero-Based Budget</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#2f5bd3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<style>
/* ===== 1. CUSTOMIZE THE LOOK: fonts, colors, background picture ===== */
:root{
  --font:system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg-image:none;            /* e.g. url("background.jpg") */
  --bg:#f6f5f1;--panel:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e3e1db;
  --accent:#2f5bd3;--ok:#2e8b57;--warn:#b7791f;--bad:#c53030;--input:#eef3ff;
  /* category colors, in category order (see CATEGORIES in the script) */
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;--c0:#8a8a8f;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141416;--panel:#1e1e21;--ink:#ececef;--muted:#9a9aa2;--line:#2e2e33;--accent:#7b9cff;--ok:#5cc28a;--warn:#e0b04f;--bad:#f07272;--input:#23283a;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;--c0:#77777d}}
:root[data-theme="dark"]{
  --bg:#141416;--panel:#1e1e21;--ink:#ececef;--muted:#9a9aa2;--line:#2e2e33;--accent:#7b9cff;--ok:#5cc28a;--warn:#e0b04f;--bad:#f07272;--input:#23283a;
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;--c0:#77777d}
/* ===== end of customize section ===== */

*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:14px/1.45 var(--font);background-color:var(--bg);background-image:var(--bg-image);background-size:cover;background-position:center;background-attachment:fixed}
header{position:sticky;top:0;z-index:10;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0 0 6px;font-size:15px;text-align:center}
.navrow{display:flex;align-items:center;gap:8px;max-width:1100px;margin:0 auto}
.pill{flex:0 0 auto;width:84px;min-height:44px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;cursor:pointer;font:600 12px/1.2 var(--font)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.wheelwrap{position:relative;flex:1;min-width:0}
.wheelwrap::before{content:"";position:absolute;left:50%;top:-4px;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--accent);z-index:1}
.wheel{position:relative;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;perspective:260px;padding:9px calc(50% - 33px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel button{flex:0 0 66px;height:38px;scroll-snap-align:center;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;cursor:pointer;font:600 14px var(--font);transition:background .2s,color .2s}
.wheel button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:1100px;margin:0 auto;padding:12px 16px}
h2{margin:4px 0;font-size:22px}
h3{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);font-size:12px;margin:0 0 8px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0;overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.card span{display:block;color:var(--muted);font-size:12px}
.card b{font-size:21px;font-variant-numeric:tabular-nums}
.ok b,.ok{color:var(--ok)}.warn b,.warn{color:var(--warn)}.bad b,.bad{color:var(--bad)}
.msg{font-weight:600;margin:0}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;border-bottom:0}
tr.grp td{font-weight:700;padding-top:12px;font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
input,select{width:100%;min-width:80px;font:inherit;color:var(--ink);background:var(--input);border:1px solid transparent;border-radius:5px;padding:5px 6px}
input[type=number]{text-align:right;min-width:90px}
input::placeholder{color:var(--muted)}
select.cat{border-left:5px solid var(--dot,var(--c0));min-width:130px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 8px;min-width:32px;min-height:32px}
.x:hover{color:var(--bad)}
.add{margin-top:8px;border:1px dashed var(--line);background:none;color:var(--accent);padding:8px 12px;border-radius:6px;cursor:pointer;font:inherit}
.bar{height:8px;background:var(--line);border-radius:4px;min-width:80px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.chart{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:160px;padding-top:8px}
.chart div{display:flex;gap:2px;align-items:end;height:100%;position:relative}
.chart i{flex:1;background:var(--c1);border-radius:4px 4px 0 0;min-height:1px}
.chart i+i{background:var(--c2)}
.chart small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;color:var(--muted);font-size:11px}
.legend{margin-top:24px;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:middle}
/* category wheel */
.catwheel{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center}
section.fit{overflow:visible}
.donut{position:relative;width:min(220px,100%);aspect-ratio:1;flex:0 0 auto}
.donut::before{content:"";position:absolute;left:50%;top:-6px;transform:translateX(-50%);border:9px solid transparent;border-top-color:var(--ink);z-index:1}
.donut svg{width:100%;height:100%;transition:transform 1.1s cubic-bezier(.15,.85,.25,1)}
.donut circle{cursor:pointer;pointer-events:stroke}
.dcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.dcenter span{font-size:12px;color:var(--muted)}
.dcenter b{font-size:20px;font-variant-numeric:tabular-nums}
.catlist{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 200px;max-width:360px}
input[type=checkbox]{width:22px;height:22px;min-width:0;accent-color:var(--ok);cursor:pointer;display:block;margin:auto}
[data-act=jump]{cursor:pointer}
[data-act=jump]:hover,[data-act=jump]:focus-visible{border-color:var(--accent)}
[data-jump]{scroll-margin-top:140px}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{from{box-shadow:0 0 0 3px var(--accent);background-color:var(--input)}}
details.settings{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:12px 0}
details.settings summary{cursor:pointer;font-weight:600;color:var(--muted)}
.catlist button{display:flex;align-items:center;gap:6px;border:1px solid transparent;background:none;color:var(--ink);padding:6px 8px;border-radius:6px;cursor:pointer;font:inherit;text-align:left}
.catlist button.on{border-color:var(--ink)}
.catlist button b{margin-left:auto;font-variant-numeric:tabular-nums}
footer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:12px;padding:0 16px 24px;max-width:1100px;margin:0 auto}
footer button,footer label,.banner button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
#drive{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.banner{max-width:1100px;margin:10px auto 0;padding:0 16px}
.banner div{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--input);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;font-weight:600}
.banner button.go{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<header>
  <h1 id="ttl"></h1>
  <div class="navrow">
    <button class="pill" data-act="tab" data-k="dash">Dashboard</button>
    <div class="wheelwrap"><div class="wheel" id="wheel"></div></div>
    <button class="pill" data-act="tab" data-k="assets">Assets &amp; Goals</button>
  </div>
</header>
<div class="banner" id="banner"></div>
<main id="app"></main>
<footer>
  <div id="drive"></div>
  <button id="export">Export backup</button>
  <label>Import backup <input id="import" type="file" accept="application/json,.json" hidden></label>
  <label>Import bank CSV <input id="bank" type="file" accept=".csv,text/csv" hidden></label>
  <span>Data is saved on this device, plus your own Google Drive if Drive backup is on.</span>
  <span>App version 2026.11.01-1 <!-- change this date each time you upload a new version --></span>
</footer>
<script>
// ===== 2. CATEGORIES: names, colors (--c1..--c8 above) and the words that pick them =====
const EXP=['Housing','Food','Transportation','Utilities','Personal','Savings & Goals','Entertainment','Debt','Other'];
const CATS=['Income',...EXP];
const color=k=>k==='Income'?'var(--ok)':EXP.indexOf(k)<8&&EXP.includes(k)?`var(--c${EXP.indexOf(k)+1})`:'var(--c0)';
const KW={
  Income:'salary,paycheck,payroll,pay,wage,bonus,income,refund,dividend,freelance,tips,commission,reimbursement,cashback,side hustle,deposit',
  Housing:'rent,mortgage,hoa,renters insurance,home insurance,property tax,cleaning,maid,furniture,home repair,repair,landlord,parking fee,storage',
  Food:'grocery,groceries,food,chips,snack,restaurant,dinner,lunch,breakfast,coffee,starbucks,mcdonalds,pizza,burger,taco,sushi,doordash,uber eats,grubhub,costco,trader joes,safeway,kroger,whole foods,aldi,boba,drink,beer,wine,bakery,takeout,fast food,chipotle,candy,soda,meal,mcdonald,wendy,popeyes,culvers,burger king,taco bell,caribou,bonchon,cub foods,super market,supermarket,vending,fooda,liquor,banh mi,tous les jours,seafood',
  Transportation:'gas,fuel,shell,chevron,exxon,arco,uber,lyft,car,vehicle,auto,toll,parking,registration,dmv,maintenance,oil change,tire,bus,train,metro,transit,car payment,car insurance,vehicle insurance,auto insurance,smog,car wash,circle k,circlek,speedway,bp,holiday,mazda,progressive,prog preferred,impark,onstreet',
  Utilities:'electric,electricity,power,water,natural gas,gas bill,internet,wifi,phone,cell,mobile,tv,cable,trash,sewer,utility,utilities,verizon,at&t,t-mobile,comcast,xfinity,spectrum,pg&e,xcel,energy',
  Personal:'shopping,amazon,clothes,clothing,shoe,haircut,salon,barber,target,walmart,gift,makeup,toiletries,laundry,doctor,dentist,pharmacy,medicine,cvs,walgreens,gym,fitness,health,medical,therapy,glasses,health insurance,school,tuition,book,pet,vet,petco,wal-mart,wm supercenter,old navy,best buy,ikea,betterhelp,office depot,officedepo',
  Entertainment:'netflix,spotify,hulu,disney,youtube,movie,game,steam,playstation,xbox,nintendo,concert,outing,ticket,subscription,tcg,pokemon,trading card,hobby,travel,hotel,flight,airbnb,bar,club,party,fun,patreon,casino,gaming,games,cards',
  Debt:'loan,student loan,school loan,credit card,cc payment,debt,payoff,installment,affirm,klarna,minimum payment,e-payment,crcardpmt,cc payment,mobile pmt',
  'Savings & Goals':'savings,save,emergency,retirement,401k,ira,roth,invest,investing,investment,brokerage,fund,down payment,goal,hysa,stock,crypto,acorns,way2save'};
const RULES=Object.entries(KW).flatMap(([cat,words])=>words.split(',').map(w=>({cat,len:w.length,re:new RegExp(`\\b${w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}s?\\b`,'i')})));
const norm=s=>String(s||'').trim().toLowerCase();
// Your own corrections win; otherwise the longest matching keyword wins ("vehicle insurance" beats "vehicle").
function guess(name){
  const learned=S?.learned?.[norm(name)];if(learned)return learned;
  let best=null;for(const r of RULES)if(r.re.test(name)&&(!best||r.len>best.len))best=r;
  return best?best.cat:'Other';
}

// ===== 3. DATA & MATH =====
const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const KEY='zero-based-budget-v1';
const xl=s=>new Date(Date.UTC(1899,11,30)+s*864e5).toISOString().slice(0,10); // Excel serial date -> ISO
const n=v=>+v||0, r2=v=>Math.round(v*100)/100;
const usd=v=>v.toLocaleString('en-US',{style:'currency',currency:'USD'});
const pct=v=>(v*100).toFixed(1)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>`&#${ch.charCodeAt(0)};`);
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
let S;

// Data from the original spreadsheet, so the app starts where the sheet left off.
function seed(){
  const S={name:'Justin',title:'Zero-Based Budget',year:'2026',view:'Oct',months:{},netWorth:{Oct:'0'},learned:{},
    items:[['Emergency Fund',46568],['Retirement Investing',51501],['Vacation Fund',46538],['Home Down Payment',47118],['New Car',47299]]
      .map(([name,d],i)=>({id:'g'+i,name,cat:'Savings & Goals',amount:'',start:0,manual:true,target:'',date:xl(d),notes:''})),
    assets:[['Gold'],['Stock'],['Real Estate'],['Land'],['Partnership 1'],['Crypto currency'],['TCG','9912','Gathered from Collectr']]
      .map(([name,value='',notes=''])=>({name,value,notes})),
    liabilities:[{name:'Credit Card',value:'',notes:'Not sure if CC is totaled here since its paid in full always.'},{name:'Car Loan',value:'',notes:''}]};
  M.forEach(m=>S.months[m]={lines:[],rec:{}});
  S.months.Sep.lines.push({name:'Main income',cat:'Income',amount:'2000',date:'',status:'Done',manual:true});
  S.months.Sep.rec.g0={amount:'2000',date:'',status:'Done'};
  S.months.Oct.lines=[['Salary bi weekly payment','Income',1124.2,46297],['Salary bi weekly payment','Income',1124.21,46311],
    ['Salary bi weekly payment','Income',1124.21,46324],['Card Cleaning','Income',98,46300],['Electric','Utilities',50,46304],
    ['Home insurance','Housing',21,46298],['Groceries','Food',200,46297],['Gas','Transportation',174,46302],['Vehicle insurance','Transportation',281,46298]]
    .map(([name,cat,a,d])=>({name,cat,amount:String(a),date:xl(d),status:'Done',manual:true}));
  return S;
}
// Converts backups from the first version of the app (income/expenses tables) to entries.
function migrate(o){
  if(o.items)return o;
  const st=s=>s==='Paid'||s==='Received'?'Done':s?'Upcoming':'';
  const N={name:o.name,title:o.title,year:o.year,view:o.view||'Jan',netWorth:o.netWorth||{},assets:o.assets||[],liabilities:o.liabilities||[],learned:{},months:{},
    items:(o.goals||[]).map(g=>({id:g.id,name:g.name,cat:'Savings & Goals',amount:'',start:0,manual:true,target:g.target,date:g.date,notes:g.notes}))};
  M.forEach(m=>{const om=o.months[m],lines=[],rec={};
    om.income.forEach(r=>n(r.amount)&&lines.push({name:r.source||r.type+' income',cat:'Income',amount:r.amount,date:r.date,status:st(r.status),manual:true}));
    for(const c in om.expenses)om.expenses[c].forEach(r=>{if(!n(r.amount))return;const g=guess(r.sub);
      lines.push({name:r.sub,cat:g==='Other'&&EXP.includes(c)?c:g,amount:r.amount,date:r.date,status:st(r.status)})});
    for(const id in om.goals||{}){const g=om.goals[id];if(n(g.amount))rec[id]={amount:g.amount,date:g.date,status:st(g.status)}}
    N.months[m]={lines,rec}});
  return N;
}

const active=(it,mi)=>it.start<=mi&&(it.end==null||mi<=it.end);
// A recurring item uses its usual amount unless this month has its own amount.
const eff=(it,mi)=>{const v=S.months[M[mi]].rec[it.id]?.amount;return v==null||v===''?it.amount:v};
function calc(mi){
  const cats=Object.fromEntries(EXP.map(c=>[c,0]));let inc=0;
  const add=(cat,a)=>{if(cat==='Income')inc+=n(a);else cats[EXP.includes(cat)?cat:'Other']+=n(a)};
  S.items.forEach(it=>active(it,mi)&&add(it.cat,eff(it,mi)));
  S.months[M[mi]].lines.forEach(l=>add(l.cat,l.amount));
  for(const c in cats)cats[c]=r2(cats[c]);
  inc=r2(inc);const total=r2(Object.values(cats).reduce((a,b)=>a+b,0)),left=r2(inc-total);
  const tone=!inc&&!total?'':left===0?'ok':left>0?'warn':'bad';
  return {inc,cats,total,left,tone,rate:inc?cats['Savings & Goals']/inc:0};
}
const msg=c=>!c.tone?'Start by adding your income, then give every dollar a job':c.left===0?'Zero-based: every dollar has a job'
  :c.left>0?`Assign ${usd(c.left)} more to reach $0.00`:`Over budget by ${usd(-c.left)}. Trim an expense.`;
const goalSaved=it=>r2(M.reduce((a,m,mi)=>a+(active(it,mi)?n(eff(it,mi)):0),0));
const totalOf=rows=>r2(rows.reduce((a,r)=>a+n(r.value),0));
const netWorth=()=>r2(totalOf(S.assets)-totalOf(S.liabilities));
// Changing a usual amount applies from the month you're on; earlier months keep the old amount.
function freeze(it,mi){for(let i=it.start;i<mi;i++){const r=S.months[M[i]].rec[it.id]??={};if(r.amount==null||r.amount==='')r.amount=String(n(it.amount))}}

try{const d=JSON.parse(localStorage.getItem(KEY));if(d)S=migrate(d)}catch{}
S??=seed();S.allow??={};
let tab='dash',selCat=null,spins=0,resort=false;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}scheduleBackup()};
const get=k=>k.split('.').reduce((o,p)=>o?.[p],S);
function set(k,v){const p=k.split('.'),last=p.pop();let o=S;for(const x of p)o=o[x]??={};o[last]=v}

// ===== 4. SCREENS. data-c marks numbers that refresh while you type =====
// Money always shows cents (every number box except Year is money).
const money=(k,v)=>k!=='year'&&v!==''&&v!=null&&!isNaN(v)?n(v).toFixed(2):v;
const inp=(k,v,label,type='text',ph='')=>`<input data-k="${k}" type="${type}" value="${esc(type==='number'?money(k,v):v)}" placeholder="${esc(ph)}" aria-label="${esc(label)}"${type==='number'?' step="0.01" inputmode="decimal"':''}>`;
const sel=(k,v,opts,label)=>`<select data-k="${k}" aria-label="${esc(label)}">${['',...opts].map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
const catSel=(k,v)=>sel(k,v,CATS,'Category').replace('<select','<select class="cat" style="--dot:'+color(v)+'"').replace('<option></option>','');
const del=(k,i,label)=>`<button class="x" data-act="del" data-k="${k}" data-i="${i}" aria-label="Remove ${esc(label)}">×</button>`;
// jump = "Month:section" (or "assets:"), so tapping the card takes you there.
const card=(label,v,cls='',jump)=>`<div class="card ${cls}" data-c${jump?` data-act="jump" data-k="${jump}" role="button" tabindex="0"`:''}><span>${label}</span><b>${typeof v==='number'?usd(v):v}</b></div>`;
const bar=(p,cls='')=>`<div class="bar"><i data-c class="${cls}" style="width:${Math.min(Math.max(p,0),1)*100}%"></i></div>`;
const C=(v,cls='n')=>`<td class="${cls}" data-c>${v}</td>`;
const grp=(cat,cols)=>`<tr class="grp"${cat==='Income'?' data-jump="income"':cat==='Savings & Goals'?' data-jump="savings"':''}><td colspan="${cols}"><span class="dot" style="background:${color(cat)}"></span>${cat}</td></tr>`;
// Rows shown grouped by category, so an entry moves to its category once it's named.
function grouped(rows,cols,row){let last,out='';
  rows.sort((a,b)=>CATS.indexOf(a.r.cat)-CATS.indexOf(b.r.cat)||a.i-b.i).forEach(x=>{if(x.r.cat!==last)out+=grp(last=x.r.cat,cols);out+=row(x.r,x.i)});
  return out;
}

// The spinning category wheel. Tap a color (or a name) and it spins to the pointer.
function catWheel(c){
  const parts=EXP.map(k=>({k,v:c.cats[k]})).filter(p=>p.v>0),tot=r2(parts.reduce((a,p)=>a+p.v,0));
  const R=80,L=2*Math.PI*R;let acc=0,rot=-360*spins;
  const segs=parts.map(p=>{const len=p.v/tot*L,start=acc;acc+=len;
    if(p.k===selCat)rot=-((start+len/2)/L*360)-360*spins;
    return `<circle data-act="cat" data-k="${esc(p.k)}" r="${R}" cx="100" cy="100" fill="none" stroke="${color(p.k)}" stroke-width="${p.k===selCat?34:28}"
      stroke-dasharray="${Math.max(len-2,.5)} ${L}" stroke-dashoffset="${-start}"><title>${esc(p.k)}: ${usd(p.v)}</title></circle>`}).join('');
  const s=parts.find(p=>p.k===selCat);
  return `<div class="catwheel"><div class="donut"><svg viewBox="0 0 200 200" data-c style="transform:rotate(${rot-90}deg)">
      ${segs||`<circle r="${R}" cx="100" cy="100" fill="none" stroke="var(--line)" stroke-width="28"></circle>`}</svg>
    <div class="dcenter" data-c>${s?`<span>${esc(s.k)}</span><b>${usd(s.v)}</b><span>${pct(s.v/tot)} of spending${c.inc?` · ${pct(s.v/c.inc)} of income`:''}</span>`
      :`<span>Total spent + saved</span><b>${usd(tot)}</b><span>${tot?'Tap a color':'Nothing yet'}</span>`}</div></div>
    <div class="catlist" data-c>${parts.map(p=>`<button data-act="cat" data-k="${esc(p.k)}" class="${p.k===selCat?'on':''}"><span class="dot" style="background:${color(p.k)}"></span>${esc(p.k)}<b>${usd(p.v)}</b></button>`).join('')||'<span class="hint">Spending shows up here by category.</span>'}</div></div>`;
}

// Allowances: a monthly spending limit per category. "Monthly" repeats every month; "This month" changes just one.
function allowSec(mi,month){
  const mo=M[mi],c=calc(mi),ov=S.months[mo].allow||{},free=EXP.filter(k=>!(k in S.allow));
  const rows=Object.keys(S.allow).sort((a,b)=>EXP.indexOf(a)-EXP.indexOf(b)).map(k=>{
    const o=ov[k],lim=n(o==null||o===''?S.allow[k]:o),sp=c.cats[k]??0,left=r2(lim-sp),tone=left<0?'bad':sp>=lim*.9?'warn':'ok';
    return `<tr><td><span class="dot" style="background:${color(k)}"></span>${esc(k)}</td>${C(left<0?'Over '+usd(-left):usd(left),'n '+tone)}<td>${bar(lim?sp/lim:sp?1:0,tone)}</td>${C(usd(sp))}
      <td>${inp('allow.'+k,S.allow[k],k+' monthly allowance','number','0.00')}</td>
      ${month?`<td>${inp(`months.${mo}.allow.${k}`,o,k+' allowance this month only','number',money('',S.allow[k])||'0.00')}</td>`:''}
      <td><button class="x" data-act="delAllow" data-k="${esc(k)}" aria-label="Remove ${esc(k)} allowance">×</button></td></tr>`}).join('');
  return `<section data-jump="allowance"><h3>Allowances · ${mo}</h3>
    <p class="hint">${rows?'Your spending limit for each category. "Spent" counts everything in that category this month, recurring and one-time.'+(month?' Use "This month" when one month gets a different limit.':''):'Give yourself a monthly limit for a category, like $200 for Food. It repeats every month.'}</p>
    ${rows?`<table><thead><tr><th>Category</th><th class="n">Left</th><th></th><th class="n">Spent</th><th class="n">Monthly</th>${month?'<th class="n">This month</th>':''}<th></th></tr></thead><tbody>${rows}</tbody></table>`:''}
    ${free.length?`<select id="allowCat" aria-label="Category for a new allowance">${free.map(k=>`<option>${esc(k)}</option>`).join('')}</select> <button class="add" data-act="addAllow">+ Add allowance</button>`:''}</section>`;
}

const html=()=>tab==='dash'?dashboard():tab==='assets'?assetsView():monthView(tab);
const app=document.getElementById('app'),ttl=document.getElementById('ttl'),wheel=document.getElementById('wheel');
function render(){
  app.innerHTML=html();
  document.querySelectorAll('header [data-act=tab]').forEach(b=>b.classList.toggle('on',b.dataset.k===tab));
  ttl.textContent=document.title=`${S.name} · ${S.title}`;
}
// Update computed cells in place so typing never loses focus.
function refresh(){
  const t=document.createElement('div');t.innerHTML=html();
  const a=app.querySelectorAll('[data-c]'),b=t.querySelectorAll('[data-c]');
  if(a.length!==b.length)return render();
  a.forEach((el,i)=>{el.innerHTML=b[i].innerHTML;if(b[i].dataset.k)el.dataset.k=b[i].dataset.k;if(typeof el.className==='string')el.className=b[i].className;el.style.cssText=b[i].style.cssText});
  ttl.textContent=`${S.name} · ${S.title}`;
}
function focusKey(k){const el=k&&app.querySelector(`[data-k="${CSS.escape(k)}"]`);if(el){el.focus({preventScroll:false});return el}}

// ===== 5. MONTH WHEEL (spins like a prize wheel, lands on a month) =====
// Three copies of the months. After a spin it quietly hops back to the middle copy, so Dec loops to Jan forever.
wheel.innerHTML=[0,1,2].flatMap(()=>M.map(m=>`<button data-act="tab" data-k="${m}">${m}</button>`)).join('');
let spinning=false,settle,lastIdx=-1;
function paintWheel(){
  const r=wheel.getBoundingClientRect(),mid=r.left+r.width/2;let best=0,bd=1e9;
  [...wheel.children].forEach((b,i)=>{const w=b.offsetWidth,br=b.getBoundingClientRect(),d=(br.left+br.width/2-mid)/w,a=Math.abs(d);
    b.style.transform=`rotateY(${Math.max(-75,Math.min(75,-d*30))}deg) scale(${a<1?1.25-a*.4:Math.max(.85-(a-1)*.2,.5)})`;
    b.style.opacity=Math.max(1-a*.25,.15);b.style.zIndex=a<.5?1:0;if(a<bd){bd=a;best=i}});
  return best;
}
const spinTo=(m,smooth)=>{
  const cur=paintWheel(),opts=[0,12,24].map(o=>o+M.indexOf(m)),i=smooth?opts.reduce((a,b)=>Math.abs(b-cur)<Math.abs(a-cur)?b:a):opts[1],b=wheel.children[i];
  wheel.scrollTo({left:b.offsetLeft-(wheel.clientWidth-b.offsetWidth)/2,behavior:smooth?'smooth':'auto'});
};
wheel.addEventListener('scroll',()=>{
  const i=paintWheel();if(spinning&&i!==lastIdx)navigator.vibrate?.(4);lastIdx=i;
  clearTimeout(settle);settle=setTimeout(()=>{
    if(i<12||i>=24)wheel.scrollLeft+=(i<12?12:-12)*(wheel.children[1].offsetLeft-wheel.children[0].offsetLeft);
    if(spinning){spinning=false;go(M[i%12],false)}},160);
},{passive:true});
['touchstart','pointerdown'].forEach(ev=>wheel.addEventListener(ev,()=>spinning=true,{passive:true}));
wheel.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();wheel.scrollLeft+=e.deltaY}spinning=true},{passive:false});
function go(k,spin=true){
  if(tab===k)return;tab=k;if(M.includes(k)){S.view=k;if(spin)spinTo(k,true)}
  save();render();
}

// ===== 6. BUTTONS & TYPING =====
function onEdit(e){
  const k=e.target.dataset.k;if(!k)return;
  const v=e.target.type==='checkbox'?(e.target.checked?'Done':''):e.target.value,p=k.split('.'),field=p.pop(),base=p.join('.'),row=get(base);
  if(p[0]==='items'&&field==='amount'&&M.includes(tab))freeze(row,M.indexOf(tab));
  set(k,v);
  if(row&&'cat' in row&&field==='cat'){row.manual=true;if(norm(row.name))S.learned[norm(row.name)]=v;e.target.style.setProperty('--dot',color(v));resort=true}
  if(row&&'cat' in row&&field==='name'&&!row.manual){const c=guess(v);
    if(c!==row.cat){row.cat=c;resort=true;const s=app.querySelector(`[data-k="${CSS.escape(base+'.cat')}"]`);if(s){s.value=c;s.style.setProperty('--dot',color(c))}}}
  save();refresh();
}
document.addEventListener('input',onEdit);
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}});
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
// After you finish typing a name, regroup so the entry sits under its category. Money gets its cents once you leave the box.
document.addEventListener('change',e=>{const t=e.target;if(t.type==='checkbox')return onEdit(e);
  if(t.type==='number'&&t.dataset.k&&t.value!==''&&money(t.dataset.k,t.value)!==t.value){t.value=money(t.dataset.k,t.value);set(t.dataset.k,t.value);save()}
  if(!resort)return;resort=false;setTimeout(()=>{
  const a=document.activeElement,k=a?.dataset?.k;let s=null;try{s=a.selectionStart}catch{}
  render();const el=focusKey(k);if(el&&s!=null)try{el.setSelectionRange(s,s)}catch{}},250)});
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-act]');if(!btn)return;
  const {act,k}=btn.dataset,i=+btn.dataset.i,mi=M.indexOf(tab);
  if(act==='tab'){spinning=false;return go(k)}
  if(act==='cat'){selCat=selCat===k?null:k;spins++;return refresh()}
  if(act==='jump'){const [to,sec]=k.split(':');spinning=false;go(to);
    const el=app.querySelector(`[data-jump="${sec}"]`)||(M.includes(to)&&app.querySelector('[data-jump="recurring"]'));
    if(!el)return scrollTo({top:0,behavior:'smooth'});
    el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');return}
  let focus;
  if(act==='add'){const list=get(k);list.push(k.endsWith('lines')?{name:'',cat:'Other',amount:'',date:today(),status:''}:{name:'',value:'',notes:''});focus=`${k}.${list.length-1}.name`}
  else if(act==='addItem'){S.items.push({id:uid(),name:'',cat:'Other',amount:'',start:mi});focus=`items.${S.items.length-1}.name`}
  else if(act==='addGoal'){S.items.push({id:uid(),name:'New goal',cat:'Savings & Goals',amount:'',start:0,manual:true,target:'',date:'',notes:''});focus=`items.${S.items.length-1}.name`}
  else if(act==='recur'){const m=S.months[tab],l=m.lines[i],id=uid();
    S.items.push({id,name:l.name,cat:l.cat,amount:l.amount,start:mi,manual:l.manual});m.rec[id]={date:l.date,status:l.status};m.lines.splice(i,1)}
  else if(act==='stop'){const it=S.items[i];
    if(it.start>=mi){if(!confirm(`Remove "${it.name||'this item'}"? It only started this month.`))return;S.items.splice(i,1)}
    else{if(!confirm(`Stop "${it.name}" from ${tab} on? Earlier months keep it.`))return;it.end=mi-1}}
  else if(act==='addAllow'){const c=document.getElementById('allowCat').value;S.allow[c]='';focus='allow.'+c}
  else if(act==='delAllow'){delete S.allow[k];M.forEach(m=>delete S.months[m].allow?.[k])}
  else if(act==='del'){if(k==='items'&&!confirm(`Delete goal "${S.items[i].name}"? Its monthly amounts stop counting.`))return;get(k).splice(i,1)}
  save();render();focusKey(focus);
});
document.getElementById('export').onclick=async()=>{
  const name=`budget-backup-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([JSON.stringify(S,null,2)],name,{type:'application/json'});
  // On phones, the share sheet lets you save to Files, Drive, email, etc.
  const done=()=>{D.last=Date.now();saveD();paintDrive()};
  if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:name});return done()}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);done();
};
const isBackup=d=>d&&typeof d.months==='object'&&Array.isArray(d.assets)&&Array.isArray(d.liabilities)&&M.every(m=>d.months[m])
  &&(Array.isArray(d.items)?M.every(m=>Array.isArray(d.months[m].lines)):Array.isArray(d.goals)&&M.every(m=>d.months[m].income&&d.months[m].expenses));
function load(d){S=migrate(d);S.netWorth??={};S.learned??={};S.allow??={};tab='dash';save();render();spinTo(S.view)}
document.getElementById('import').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(!isBackup(d))throw 0;
    if(confirm('Replace all current data with this backup?'))load(d);
  }catch{alert('That file is not a budget backup.')}
  e.target.value='';
};

// Bank CSV: each transaction lands in its month. An unpaid recurring item with the exact same amount gets checked off
// instead of added twice. Importing the same file again skips rows already imported.
function csv(t){const rows=[[]];let f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){rows.at(-1).push(f);f=''}
    else if(c==='\n'){rows.at(-1).push(f.replace(/\r$/,''));f='';rows.push([])}else f+=c}
  rows.at(-1).push(f);return rows.filter(r=>r.join('').trim())}
// "PURCHASE AUTHORIZED ON 10/27 CIRCLE K #2653850 1770 SAINT PAUL MN P0000… CARD 7077" → "Circle K"
const bankName=d=>d.replace(/\s+/g,' ').replace(/^(PURCHASE( RETURN)?|RECURRING PAYMENT) AUTHORIZED ON \d\d\/\d\d /i,'')
  .replace(/ ON \d\d\/\d\d\b/,'').replace(/ REF # \S+/,'').replace(/#\S*/g,'').replace(/\b(TST|SQ|PY|PP|CTLP|BH) ?\*/g,'')
  .replace(/ ?(\S*\d{4}|(?=\S*\d)\S{10,})\S*.*$/,'').replace(/ [A-Z]{2}$/,'').replace(/ +/g,' ').trim().toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase())||'Bank transaction';
function bankImport(text){
  const rows=csv(text),head=rows[0].map(norm),col=re=>head.findIndex(h=>re.test(h));
  let [di,ni,ai]=[col(/date/),col(/desc|payee|name|memo/),col(/amount/)];
  if(di<0||ni<0||ai<0){if(rows[0].length===5&&/\d\/\d/.test(rows[0][0]))[di,ni,ai]=[0,4,1];else return null}// Wells Fargo files without a header row
  else rows.shift();
  // shortcut: banks that split money into separate Debit/Credit columns aren't read, add them if someone needs it
  const seen=new Set(M.flatMap(m=>[...S.months[m].lines.map(l=>l.ref),...Object.values(S.months[m].rec).map(r=>r.ref)]));
  const res={added:0,paid:0,dup:0,other:0};
  for(const r of rows){
    const [mm,dd,yy]=String(r[di]).split('/').map(Number),a=n(String(r[ai]).replace(/[$,]/g,''));
    if(!mm||!a||String(yy).slice(-2)!==String(S.year).slice(-2)){res.other++;continue}
    const ref=[r[di],r[ai],r[ni]].join('|');if(seen.has(ref)){res.dup++;continue}seen.add(ref);
    const mi=mm-1,m=S.months[M[mi]],date=`${S.year}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const it=S.items.find(it=>active(it,mi)&&!m.rec[it.id]?.ref&&m.rec[it.id]?.status!=='Done'&&(it.cat==='Income')===(a>0)&&n(eff(it,mi))===Math.abs(a));
    if(it){Object.assign(m.rec[it.id]??={},{status:'Done',date,ref});res.paid++;continue}
    const name=bankName(String(r[ni]));
    m.lines.push({name,cat:a>0?'Income':guess(name),amount:Math.abs(a).toFixed(2),date,status:'Done',ref});res.added++;
  }
  return res;
}
document.getElementById('bank').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const before=JSON.stringify(S),res=bankImport(await f.text());
  if(!res)return alert('That file doesn\'t look like a bank CSV (it needs Date, Description and Amount columns).');
  if(!confirm(`Add ${res.added} entries and check off ${res.paid} recurring bills?`+(res.dup?`\n${res.dup} were already imported and will be skipped.`:'')
    +(res.other?`\n${res.other} rows are not in ${S.year} and will be skipped.`:''))){S=JSON.parse(before);return}
  save();render();
};

// ===== 7. GOOGLE DRIVE AUTO-BACKUP =====
// Paste your OAuth Client ID between the quotes (see README). Left empty, Drive backup stays hidden.
const GOOGLE_CLIENT_ID='558610090512-hq8fkco1b3r959t3lqb70l7dddmmjjt2.apps.googleusercontent.com';
// Saves one file in the person's own Drive a few seconds after each change, only while the app is open.
// drive.file scope = the app can only see files it created, nothing else in their Drive.
const DKEY='zero-based-budget-drive',FILE='Zero-Based Budget backup.json',API='https://www.googleapis.com';
let D={},dTimer;
try{D=JSON.parse(localStorage.getItem(DKEY))||{}}catch{}
const saveD=()=>{try{localStorage.setItem(DKEY,JSON.stringify(D))}catch{}};
if(!D.first){D.first=Date.now();saveD()}  // backup reminder counts from first use
const tokenOk=()=>!!D.token&&Date.now()<D.exp-60e3;
const appUrl=()=>location.origin+location.pathname.replace(/index\.html$/,'');
function connect(after=''){
  D.state=Math.random().toString(36).slice(2);D.after=after;saveD();
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams({client_id:GOOGLE_CLIENT_ID,redirect_uri:appUrl(),
    response_type:'token',scope:'https://www.googleapis.com/auth/drive.file',include_granted_scopes:'true',state:D.state});
}
async function api(url,o={}){
  const r=await fetch(url,{...o,headers:{...o.headers,Authorization:'Bearer '+D.token}});
  if(r.status===401){D.token=null;saveD();throw 'auth'}
  return r;
}
async function findFile(){
  const r=await api(`${API}/drive/v3/files?`+new URLSearchParams({q:`name='${FILE}' and trashed=false`,orderBy:'modifiedTime desc',fields:'files(id,modifiedTime)',pageSize:'1'}));
  return r.ok?(await r.json()).files[0]:null;
}
async function restoreFrom(id){
  const r=await api(`${API}/drive/v3/files/${id}?alt=media`);const d=r.ok?await r.json().catch(()=>null):null;
  if(!isBackup(d))return alert('The Drive backup could not be read.');
  load(d);
}
function scheduleBackup(){if(!D.on)return;D.dirty=true;saveD();clearTimeout(dTimer);dTimer=setTimeout(backupNow,3000);paintDrive()}
async function backupNow(keepalive=false){
  clearTimeout(dTimer);if(!D.on||!tokenOk())return paintDrive();
  const body=JSON.stringify(S);D.busy=true;paintDrive();
  try{
    let r;
    if(D.fileId){r=await api(`${API}/upload/drive/v3/files/${D.fileId}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body,keepalive});
      if(r.status===404)D.fileId=null}  // someone deleted it in Drive: make a new one
    if(!D.fileId){const b='zbb'+Date.now();
      r=await api(`${API}/upload/drive/v3/files?uploadType=multipart&fields=id`,{method:'POST',headers:{'Content-Type':`multipart/related; boundary=${b}`},
        body:`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:FILE,mimeType:'application/json'})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`});
      if(r.ok)D.fileId=(await r.json()).id}
    if(r.ok){D.dirty=false;D.last=Date.now();D.err=''}else D.err=`Drive said no (${r.status}). Will retry.`;
  }catch(e){D.err=e==='auth'?'':'No connection. Will retry.'}
  D.busy=false;saveD();paintDrive();
}
// Coming back from Google's sign-in page with a token in the address.
async function handleRedirect(){
  if(!/[#&](access_token|error)=/.test(location.hash))return;
  const h=new URLSearchParams(location.hash.slice(1));history.replaceState(null,'',appUrl());
  if(!D.state||h.get('state')!==D.state)return;
  const after=D.after;delete D.state;delete D.after;
  if(!h.get('access_token')){saveD();paintDrive();return alert('Google Drive backup was not turned on.')}
  D.token=h.get('access_token');D.exp=Date.now()+(+h.get('expires_in')||3600)*1000;D.on=true;saveD();
  try{
    if(!D.fileId||after==='restore'){const f=await findFile();
      // Never overwrite an existing Drive backup by surprise: ask first, and if they say no, start a separate file.
      if(f&&confirm(`Found a backup in your Google Drive from ${new Date(f.modifiedTime).toLocaleString()}.\n\nOK = load it onto this device.\nCancel = keep this device's data (saved as a new Drive file; the old one stays).`)){D.fileId=f.id;saveD();await restoreFrom(f.id)}
      else if(after==='restore'&&!f)alert('No backup found in this Google Drive yet.');
    }
  }catch{}
  backupNow();
}
function paintDrive(){
  const el=document.getElementById('drive'),ban=document.getElementById('banner');
  const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} hr ago`:`${Math.round(m/1440)} days ago`};
  el.innerHTML=!GOOGLE_CLIENT_ID?'':!D.on?`<button data-drive="on">☁ Turn on Google Drive backup</button>`
    :`<span>☁ Drive backup on · ${D.busy?'saving…':!tokenOk()&&D.dirty?'paused, reconnect to save':D.dirty?'saving soon…':D.last?'saved '+ago(D.last):'connected'}${D.err?' · '+esc(D.err):''}</span>
      <button data-drive="restore">Restore from Drive</button><button data-drive="off">Turn off</button>`;
  const days=(Date.now()-(D.last||D.first))/864e5;
  ban.innerHTML=D.on&&D.dirty&&!tokenOk()?`<div>☁ Your changes aren't backed up yet. Google sign-in expired. <button class="go" data-drive="reconnect">Reconnect</button></div>`
    :!D.on&&days>=7&&Date.now()>(D.snooze||0)?`<div>It's been ${D.last?Math.floor(days)+' days since your last backup':'a while and you haven\'t backed up yet'}.
      ${GOOGLE_CLIENT_ID?'<button class="go" data-drive="on">☁ Turn on Drive backup</button>':''}<button data-drive="export">Export backup</button><button data-drive="snooze">Later</button></div>`:'';
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-drive]')?.dataset.drive;if(!a)return;
  if(a==='on'){if(confirm('Back up automatically to your Google Drive?\n\nThe app saves one file, "'+FILE+'", in your own Drive a few seconds after each change while the app is open. It can\'t see anything else in your Drive.\n\nYou\'ll sign in with Google next.'))connect()}
  else if(a==='reconnect')connect();
  else if(a==='restore'){if(tokenOk()&&D.fileId){if(confirm('Replace this device\'s data with the Drive backup?'))restoreFrom(D.fileId).catch(()=>connect('restore'))}else connect('restore')}
  else if(a==='off'){if(confirm('Turn off Drive backup? The backup file stays in your Drive.')){D={first:D.first,last:D.last};saveD();paintDrive()}}
  else if(a==='export')document.getElementById('export').click();
  else if(a==='snooze'){D.snooze=Date.now()+864e5;saveD();paintDrive()}
});
// Save right away when the app is put away, and retry when the connection comes back. No timers run while it's closed.
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&D.dirty)backupNow(true)});
addEventListener('online',()=>D.dirty&&backupNow());
setInterval(()=>D.on&&paintDrive(),60e3); // refreshes "saved N min ago"; does nothing in the background
